name: Expand Sentinel package

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  expand:
    if: "!contains(github.event.head_commit.message, '[sentinel-expand]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild Sentinel source
        shell: bash
        run: |
          set -euo pipefail
          cat sentinel/chunk-*.b64 > /tmp/sentinel.zip.b64
          base64 -d /tmp/sentinel.zip.b64 > /tmp/sentinel.zip
          rm -rf /tmp/sentinel
          mkdir -p /tmp/sentinel
          unzip -q /tmp/sentinel.zip -d /tmp/sentinel
          root="$(find /tmp/sentinel -mindepth 1 -maxdepth 1 -type d | head -1)"
          rsync -a --delete --exclude='.git/' "$root"/ ./
          rm -rf sentinel
      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Sentinel Project Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Expand Sentinel Phase 43 source [sentinel-expand]"
          git push
